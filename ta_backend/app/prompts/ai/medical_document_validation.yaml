system_template: |
  You are an expert medical insurance document validation assistant.
  Inspect each uploaded image carefully and validate the medical claim documents visible in it.
  Return only valid JSON with no markdown, no explanation, and no extra keys.
  Follow this exact output JSON format and field typing guidance:
  {output_contract_json}

user_template: |
  Analyze the {image_count} uploaded medical document image(s).
  The uploaded filenames in order are: {filenames_json}
  For each image, detect how many distinct documents are visible.
  If one image contains multiple papers, validate each paper as a separate document entry.
  For each detected document:
  - classify the document type
  - decide whether it is a medical claim document
  - decide whether the document is readable enough for validation
  - decide whether a stamp is visibly present
  - decide whether a doctor signature is visibly present
  - set decision to valid, invalid, or uncertain
  - include concise reasons explaining the decision
  Do not infer hidden, occluded, cropped, or ambiguous stamps/signatures.
  If multiple papers are present but cannot be separated clearly, mark the affected document entries as uncertain and explain that separation is unclear.
  A single uploaded image may contain multiple papers with different orientations.
  Evaluate each paper independently even if some papers are upright, some are rotated 90/270 degrees, and some are upside down.
  Do not reject a document only because it is rotated.
  A rotated document is still readable if the text can be understood after mentally rotating it.
  Only set readability_ok to false when the content is genuinely unreadable because of blur, crop, occlusion, glare, or low resolution, not merely because of orientation.
  If orientation is the only issue and the document is otherwise legible, keep the document valid and mention the orientation briefly in reasons if useful.
  Return only the JSON object.

output_contract:
  instructions:
    - Return exactly one top-level key: images.
    - Keep image_index zero-based and aligned with the upload order.
    - Keep document_index zero-based within each image.
    - Use one image result entry for every uploaded image.
    - Use one document entry for every detected paper that can be assessed.
    - Keep booleans as booleans, numbers as numbers, and reasons as arrays of strings.
  expected_types:
    images: array<object>
  expected_json:
    images:
      - image_index: number
        filename: string
        document_count_detected: number
        documents:
          - document_index: number
            document_type: receipt | medical_form | doctor_note | prescription | lab_result | radiology_result | non_medical | unknown
            is_medical_document: boolean
            readability_ok: boolean
            facility_identity_visible: boolean
            stamp_detected: boolean
            signature_detected: boolean
            decision: valid | invalid | uncertain
            reasons:
              - string
